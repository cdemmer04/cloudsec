name: Terraform-Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["terraform/**"]

  pull_request:
    branches: [main]
    paths: ["terraform/**"]

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v3
      - name: Use Node.js 14.x
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 14.x
        
      # Note: Credentials need to be changed after every restart of the AWS learner lab environment
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      
      - name: Install Terraform
        run: |
          # Update apt and install terraform
          sudo apt-get update
          sudo apt-get install snapd -y
          sudo snap install terraform --classic

          # Verify installation of terraform
          terraform --version

      # Run plan
      - name: Initialise project and view terraform plan
        run: |
          cd terraform
          terraform fmt
          terraform init
          terraform plan

  deploy:
    name: Terraform Deploy
    needs: plan
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v3
      - name: Use Node.js 14.x
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 14.x
        
      # Note: Credentials need to be changed after every restart of the AWS learner lab environment
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      
      - name: Install Terraform
        run: |
          # Update apt and install terraform
          sudo apt-get update
          sudo apt-get install snapd -y
          sudo snap install terraform --classic

          # Verify installation of terraform
          terraform --version

      # Run plan
      - name: Initialise project and view terraform plan
        run: |
          cd terraform
          terraform fmt
          terraform init
          terraform apply --auto-approve